<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Communications Service test console</title>
<style>
  :root {
    --paper:#F4F5F7; --surface:#fff; --surface-2:#EAEDF1; --line:#D5DAE1;
    --text:#1B222C; --dim:#5A6675; --accent:#A85F2C; --accent-soft:#F0E2D6;
    --good:#2F7D5C; --good-soft:#DDEDE5; --bad:#A3402F; --bad-soft:#F6E0DC;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0E1218; --surface:#161C24; --surface-2:#1D242E; --line:#2A333F;
      --text:#DCE3EB; --dim:#8794A5; --accent:#D08A52; --accent-soft:#33241A;
      --good:#5FB78F; --good-soft:#16281F; --bad:#E08573; --bad-soft:#2C1A16;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--paper); color:var(--text);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 72px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); margin:0 0 24px; font-size:14px; }
  .card {
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:18px; margin-bottom:16px;
  }
  h2 {
    font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--dim); margin:0 0 14px; font-weight:600;
  }
  label { display:block; font-size:13px; color:var(--dim); margin:0 0 5px; }
  .field { margin-bottom:13px; }
  input, select, textarea {
    width:100%; padding:9px 11px; font-family:var(--mono); font-size:14px;
    background:var(--paper); color:var(--text);
    border:1px solid var(--line); border-radius:4px;
  }
  textarea { font-family:var(--sans); resize:vertical; min-height:72px; }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 180px; }
  button {
    font:inherit; font-weight:600; padding:10px 18px; border-radius:4px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
  }
  button.ghost { background:transparent; color:var(--accent); }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .hint { font-size:12.5px; color:var(--dim); margin:9px 0 0; }
  .out {
    font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word;
    padding:12px 14px; border-radius:4px; margin-top:14px;
    background:var(--surface-2); border-left:3px solid var(--line);
  }
  .out.good { background:var(--good-soft); border-left-color:var(--good); }
  .out.bad  { background:var(--bad-soft);  border-left-color:var(--bad); }
  .out:empty { display:none; }
  .status { display:flex; gap:8px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; margin-bottom:20px; }
  .chip {
    padding:3px 9px; border-radius:20px; border:1px solid var(--line);
    color:var(--dim); background:var(--surface);
  }
  .chip.on  { color:var(--good); border-color:var(--good); background:var(--good-soft); }
  .chip.off { color:var(--bad);  border-color:var(--bad);  background:var(--bad-soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Communications console</h1>
  <p class="sub">Place a call or send a message through this server. Your key stays in this browser. Calls and messages may be stored by this service.</p>

  <div class="status" id="status"><span class="chip">checking&hellip;</span></div>

  <div class="card">
    <h2>Connection</h2>
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off">
    <label for="tenant">Organization ID (for scoped API keys)</label>
    <input id="tenant" autocomplete="off">
    <div class="actions"><button id="connect">Load phone lines</button></div>
    <div class="out" id="connection" role="status"></div>
  </div>
  <div class="card">
    <h2>Phone line</h2>
    <label for="from">Configured number</label>
    <select id="from" disabled></select>
    <h3>Recent activity</h3>
    <div id="activity" aria-live="polite"></div>
    <button id="refresh" class="ghost" disabled>Refresh activity</button>
  </div>
  <div class="card">
    <label for="client">Client phone number (international format)</label>
    <input id="client" type="tel" placeholder="+61400000000">
    <h3>Calls and texts on this line</h3>
    <div id="history" class="out" role="status"></div>
    <button id="older" class="ghost" hidden>Earlier exchanges</button>
    <div class="actions"><button id="callBtn" disabled>Call with AI voice</button></div>
    <label for="smsBody">Text message</label>
    <textarea id="smsBody" maxlength="1600"></textarea>
    <div class="actions"><button id="smsBtn" disabled>Send SMS</button></div>
    <div class="out" id="result" role="status"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const validPhone = /^\+[1-9]\d{1,14}$/;
  let lines = [], generation = 0, activityGeneration = 0, connectionGeneration = 0;
  let next = null, previewReady = false, sending = false;
  const pending = new Map();
  const STORE = 'assistant-console';
  const oldSettings = JSON.parse(localStorage.getItem(STORE) || '{}');
  $('tenant').value = oldSettings.tenant || '';
  $('key').value = oldSettings.key || '';

  function headers() {
    const h = {'X-API-Key':$('key').value.trim()};
    if ($('tenant').value.trim()) h['X-Tenant-Id'] = $('tenant').value.trim();
    return h;
  }
  async function read(path) {
    const response = await fetch(path,{headers:headers(),cache:'no-store'});
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'Request failed');
    return data;
  }
  function linePath() {
    return '/v1/phone-lines/' + encodeURIComponent($('from').value) + '/activity';
  }
  function updateActions() {
    const line = lines.find(item => item.twilio_number === $('from').value);
    $('callBtn').disabled = sending || !previewReady || !line?.call_enabled;
    $('smsBtn').disabled = sending || !previewReady || !line?.sms_enabled || !$('smsBody').value.trim();
  }
  async function history(append = false) {
    const version = ++generation;
    const client = $('client').value.trim();
    if (!append) {
      previewReady = false;
      $('history').textContent = '';
      $('result').textContent = '';
      next = null;
    }
    $('older').hidden = true;
    updateActions();
    if (!validPhone.test(client) || !$('from').value) return;
    const params = new URLSearchParams({client});
    if (append && next) params.set('cursor',next);
    if (!append) $('history').textContent = 'Loading history...';
    try {
      const data = await read(linePath() + '?' + params);
      if (version !== generation) return;
      if (data.status === 'unavailable') throw Error();
      const text = data.items.map(item => new Date(item.occurred_at).toLocaleString() + '  ' + item.direction + ' ' + item.channel + '\n' + (item.content || item.status || '')).join('\n\n');
      $('history').textContent = append ? $('history').textContent + '\n\n' + text : text || 'No eligible previous exchanges on this line.';
      next = data.next;
      $('older').hidden = !next;
    } catch {
      if (version !== generation) return;
      const notice = 'History temporarily unavailable.';
      $('history').textContent = append ? $('history').textContent + '\n' + notice : notice;
      $('older').hidden = !next;
    }
    previewReady = true;
    updateActions();
  }
  async function activity() {
    const version = ++activityGeneration;
    if (!$('from').value) return;
    try {
      const data = await read(linePath());
      if (version !== activityGeneration) return;
      $('activity').replaceChildren();
      if (!data.items.length) $('activity').textContent = data.status === 'unavailable' ? 'Activity unavailable.' : 'No recent activity.';
      for (const item of data.items) {
        const button = document.createElement('button');
        button.className = 'ghost';
        button.textContent = item.client + ' / ' + item.direction + ' ' + item.channel + ' / ' + new Date(item.occurred_at).toLocaleString();
        button.onclick = () => { if ($('client').value !== item.client) $('smsBody').value = ''; $('client').value = item.client; history(); };
        $('activity').append(button);
      }
    } catch { if (version === activityGeneration) $('activity').textContent = 'Activity unavailable.'; }
  }
  function resetConnection() {
    connectionGeneration++;
    activityGeneration++;
    lines = [];
    $('from').replaceChildren();
    $('from').disabled = $('refresh').disabled = true;
    $('activity').replaceChildren();
    $('connection').textContent = '';
    history();
  }
  async function connect() {
    resetConnection();
    const version = connectionGeneration;
    try {
      const data = await read('/v1/phone-lines');
      if (version !== connectionGeneration) return;
      lines = data.items;
      if (lines.length > 1) $('from').add(new Option('Choose a phone line',''));
      for (const line of lines) $('from').add(new Option([line.name,line.twilio_number].filter(Boolean).join(' / '),line.twilio_number));
      if (lines.some(line=>line.twilio_number === oldSettings.from) && oldSettings.tenant === $('tenant').value) $('from').value = oldSettings.from;
      $('from').disabled = $('refresh').disabled = !lines.length;
      oldSettings.key = $('key').value;
      oldSettings.tenant = $('tenant').value;
      localStorage.setItem(STORE,JSON.stringify(oldSettings));
      $('connection').textContent = lines.length ? '' : 'No configured lines for this organization.';
      activity(); history();
    } catch (error) { if (version === connectionGeneration) $('connection').textContent = error.message; }
  }
  async function send(channel) {
    if (sending || !previewReady) return;
    const version = generation, path = '/v1/' + (channel === 'voice' ? 'calls' : 'messages');
    const payload = {from:$('from').value,to:$('client').value.trim()};
    if (channel === 'sms') payload.body = $('smsBody').value;
    const signature = JSON.stringify([$('tenant').value,$('key').value,path,payload]);
    const key = pending.get(signature) || crypto.randomUUID();
    pending.set(signature,key);
    sending = true; updateActions();
    $('result').textContent = 'Submitting...';
    try {
      const response = await fetch(path,{method:'POST',headers:{...headers(),'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify(payload)});
      const data = await response.json();
      if (response.ok || data.dispatched === false) pending.delete(signature);
      if (version !== generation) return;
      if (!response.ok) throw Error(data.error || 'Request failed');
      const message = (channel === 'voice' ? 'Call accepted' : 'SMS accepted') + ' / ' + data.communication_id
        + (data.history_status === 'unavailable' ? ' / History was unavailable at dispatch.' : '');
      if (channel === 'sms') $('smsBody').value = '';
      activity();
      const refreshed = history();
      $('result').textContent = message;
      await refreshed;
    } catch (error) { if (version === generation) $('result').textContent = error.message; }
    finally { sending = false; updateActions(); }
  }
  $('connect').onclick = connect;
  $('key').oninput = $('tenant').oninput = resetConnection;
  $('from').onchange = () => { oldSettings.from = $('from').value; localStorage.setItem(STORE,JSON.stringify(oldSettings)); $('activity').replaceChildren(); $('smsBody').value=''; activity(); history(); };
  $('client').oninput = () => { $('smsBody').value = ''; history(); };
  $('older').onclick = () => history(true);
  $('refresh').onclick = () => { activity(); history(); };
  $('smsBody').oninput = updateActions;
  $('callBtn').onclick = () => send('voice');
  $('smsBtn').onclick = () => send('sms');
  if ($('key').value) connect();

  // Report what the server can actually do, so a 503 is never a surprise.
  fetch('/health')
    .then((r) => r.json())
    .then((h) => {
      $('status').innerHTML = '';
      const chip = (label, state) => {
        const el = document.createElement('span');
        el.className = 'chip' + (state === null ? '' : state ? ' on' : ' off');
        el.textContent = label;
        $('status').appendChild(el);
      };
      chip(h.version || 'unknown', null);
      // The source fingerprint, not the commit: on hosts without git it is the
      // only thing that actually changes when a deploy lands.
      if (h.build) chip('build ' + h.build, null);
      chip('model ' + h.model, null);
      chip('Twilio ' + (h.twilio?.stale ? 'stale' : h.twilio?.status || 'not checked'), h.twilio?.accountReady === true);
      if (h.twilio?.balanceState) chip('Twilio balance ' + h.twilio.balanceState, h.twilio.balanceState === 'ok' && h.twilio.accountReady);
      chip('LLMs ' + (h.llm?.stale ? 'stale' : h.llm?.status || 'not checked'), h.llm?.allWorking && !h.llm?.stale && !h.llm?.checking);
      for (const model of h.llm?.models || []) {
        chip(model.model + ' (' + model.transport + '): ' + model.status, model.usable && !h.llm.stale);
      }
      if (h.llm?.checkedAt) chip('models checked ' + new Date(h.llm.checkedAt).toLocaleString(), null);
      chip(h.persistenceProvider ? `${h.persistenceProvider} persistence` : 'persistence off', Boolean(h.persistenceProvider));
      chip(h.outboundCalls ? 'outbound configured' : 'outbound not configured', h.outboundCalls);
    })
    .catch(() => {
      $('status').innerHTML = '<span class="chip off">server unreachable</span>';
    });
</script>
</body>
</html>
